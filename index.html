<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHOBOR | Premium News</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Modern Light Palette */
            --primary: #000000;
            --accent: #E31E24;
            --bg-body: #F2F2F7;
            --bg-card: #FFFFFF;
            --text-main: #1C1C1E;
            --text-muted: #8E8E93;
            --border: rgba(0,0,0,0.08);
            --input-bg: #E9E9EB;
            --glass: rgba(255, 255, 255, 0.8);
            --radius-lg: 24px;
            --radius-md: 16px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
        }

        [data-theme="dark"] {
            --primary: #FFFFFF;
            --accent: #FF453A;
            --bg-body: #000000;
            --bg-card: #1C1C1E;
            --text-main: #F2F2F7;
            --text-muted: #8E8E93;
            --border: rgba(255,255,255,0.1);
            --input-bg: #2C2C2E;
            --glass: rgba(28, 28, 30, 0.8);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background 0.3s ease;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background: var(--bg-body);
            position: relative;
        }

        /* --- Header --- */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -1px;
            text-transform: uppercase;
        }
        .logo span { color: var(--accent); }

        .header-actions { display: flex; gap: 12px; }

        .icon-btn {
            background: var(--input-bg);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-main);
            transition: transform 0.2s active;
        }
        .icon-btn:active { transform: scale(0.9); }

        /* --- Search --- */
        .search-area {
            padding: 12px 20px;
            background: var(--bg-card);
        }
        .search-box {
            background: var(--input-bg);
            border-radius: 12px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-box input {
            border: none;
            background: transparent;
            width: 100%;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-main);
            outline: none;
        }

        /* --- Categories --- */
        .tabs-container {
            background: var(--bg-card);
            padding: 12px 0;
            overflow-x: auto;
            display: flex;
            gap: 10px;
            padding-left: 20px;
            scrollbar-width: none;
            border-bottom: 1px solid var(--border);
        }
        .tabs-container::-webkit-scrollbar { display: none; }

        .tab {
            padding: 8px 18px;
            background: var(--input-bg);
            border-radius: 100px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            color: var(--text-muted);
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab.active {
            background: var(--accent);
            color: white;
        }

        /* --- News Feed --- */
        .news-feed {
            padding: 20px;
            padding-bottom: 100px;
        }

        .news-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            overflow: hidden;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: transform 0.3s ease;
        }
        .news-card:active { transform: scale(0.98); }

        .card-img-wrap {
            position: relative;
            height: 220px;
            background: var(--input-bg);
        }
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .source-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--accent);
            color: white;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .card-content { padding: 18px; }
        .card-title {
            font-size: 19px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 10px;
            color: var(--text-main);
        }
        .card-desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }
        .time { font-size: 12px; color: var(--text-muted); font-weight: 500; }
        .read-more {
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* --- Navigation --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 10px 0 25px 0;
            border-top: 1px solid var(--border);
            z-index: 1000;
        }
        .nav-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            gap: 4px;
            cursor: pointer;
        }
        .nav-btn.active { color: var(--accent); }
        .nav-btn svg { width: 22px; height: 22px; }

        /* --- Skeletons --- */
        .skeleton {
            background: var(--input-bg);
            overflow: hidden;
            position: relative;
        }
        .skeleton::after {
            content: "";
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            transform: translateX(-100%);
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 100% { transform: translateX(100%); } }

        /* --- Transitions --- */
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* About Page */
        #about-page { padding: 40px 20px; text-align: center; }
        .about-card {
            background: var(--bg-card);
            padding: 30px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="logo">Kho<span>bor</span></div>
        <div class="header-actions">
            <button class="icon-btn" onclick="toggleTheme()" id="theme-btn">🌙</button>
            <button class="icon-btn" onclick="refreshNews()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
            </button>
        </div>
    </header>

    <div id="home-view">
        <div class="search-area">
            <div class="search-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="search-input" placeholder="Search topics..." onkeypress="handleSearch(event)">
            </div>
        </div>

        <div class="tabs-container">
            <button class="tab active" onclick="setCategory('general', this)">Top News</button>
            <button class="tab" onclick="setCategory('world', this)">World</button>
            <button class="tab" onclick="setCategory('nation', this, 'Bangladesh')">Bangladesh</button>
            <button class="tab" onclick="setCategory('business', this)">Finance</button>
            <button class="tab" onclick="setCategory('technology', this)">Tech</button>
            <button class="tab" onclick="setCategory('sports', this)">Sports</button>
        </div>

        <main id="news-list" class="news-feed"></main>
    </div>

    <div id="about-view" class="hidden">
        <div id="about-page">
            <div class="about-card">
                <h1 style="font-size: 32px; margin-bottom: 10px;">Khobor</h1>
                <p style="color: var(--accent); font-weight: 800; margin-bottom: 20px;">v 2.0 Premium</p>
                <p style="color: var(--text-muted); line-height: 1.6;">Designed for high-speed news delivery and a refined reading experience. All sources are verified global outlets.</p>
                <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border);">
                    <p style="font-size: 13px; color: var(--text-muted);">Crafted by Saif Sunny</p>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="navigate('home', this)">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Home
        </button>
        <button class="nav-btn" onclick="navigate('about', this)">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            About
        </button>
    </nav>
</div>

<script>
    const API_KEY = '4705869ca912f7ced71f643602ad5aa6'; // Note: GNews has daily limits
    let currentCategory = 'general';
    let searchQuery = '';

    // --- Time Ago Formatter ---
    function timeAgo(dateString) {
        const date = new Date(dateString);
        const now = new Date();
        const seconds = Math.floor((now - date) / 1000);
        let interval = Math.floor(seconds / 31536000);
        if (interval > 1) return interval + " years ago";
        interval = Math.floor(seconds / 2592000);
        if (interval > 1) return interval + " months ago";
        interval = Math.floor(seconds / 86400);
        if (interval > 1) return interval + " days ago";
        interval = Math.floor(seconds / 3600);
        if (interval > 1) return interval + " hours ago";
        interval = Math.floor(seconds / 60);
        if (interval > 1) return interval + " mins ago";
        return "Just now";
    }

    // --- Theme Logic ---
    function initTheme() {
        const theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.getElementById('theme-btn').innerText = theme === 'light' ? '🌙' : '☀️';
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        document.getElementById('theme-btn').innerText = next === 'light' ? '🌙' : '☀️';
    }

    // --- News Logic ---
    async function fetchNews() {
        const container = document.getElementById('news-list');
        renderSkeletons();

        let url = `https://gnews.io/api/v4/top-headlines?category=${currentCategory}&lang=en&apikey=${API_KEY}`;
        if (searchQuery) {
            url = `https://gnews.io/api/v4/search?q=${searchQuery}&lang=en&apikey=${API_KEY}`;
        }

        try {
            const response = await fetch(url);
            const data = await response.json();
            if (data.articles) {
                renderArticles(data.articles);
            } else {
                showState("API Limit Reached. Try again later.");
            }
        } catch (e) {
            showState("Connection Error. Check your internet.");
        }
    }

    function renderArticles(articles) {
        const container = document.getElementById('news-list');
        container.innerHTML = '';
        
        if (articles.length === 0) {
            showState("No news found for this topic.");
            return;
        }

        articles.forEach((art, index) => {
            const card = document.createElement('div');
            card.className = 'news-card fade-in';
            card.style.animationDelay = `${index * 0.1}s`;
            card.innerHTML = `
                <div class="card-img-wrap">
                    <img class="card-img" src="${art.image || 'https://images.unsplash.com/photo-1504711432869-efd597cdd042?w=500'}" alt="news">
                    <span class="source-badge">${art.source.name}</span>
                </div>
                <div class="card-content">
                    <h2 class="card-title">${art.title}</h2>
                    <p class="card-desc">${art.description ? art.description.substring(0, 95) + '...' : ''}</p>
                    <div class="card-meta">
                        <span class="time">${timeAgo(art.publishedAt)}</span>
                        <a href="${art.url}" target="_blank" class="read-more">Read Full →</a>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function setCategory(cat, el, query = '') {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        currentCategory = cat;
        searchQuery = query;
        fetchNews();
    }

    function handleSearch(e) {
        if (e.key === 'Enter') {
            searchQuery = e.target.value.trim();
            fetchNews();
            e.target.blur();
        }
    }

    function navigate(view, el) {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        
        document.getElementById('home-view').classList.toggle('hidden', view !== 'home');
        document.getElementById('about-view').classList.toggle('hidden', view !== 'about');
        window.scrollTo(0,0);
    }

    function renderSkeletons() {
        const container = document.getElementById('news-list');
        container.innerHTML = '';
        for (let i = 0; i < 3; i++) {
            container.innerHTML += `
                <div class="news-card">
                    <div class="card-img-wrap skeleton"></div>
                    <div class="card-content">
                        <div class="skeleton" style="height:24px; width:80%; margin-bottom:12px; border-radius:4px;"></div>
                        <div class="skeleton" style="height:16px; width:100%; margin-bottom:8px; border-radius:4px;"></div>
                        <div class="skeleton" style="height:16px; width:60%; border-radius:4px;"></div>
                    </div>
                </div>`;
        }
    }

    function showState(msg) {
        document.getElementById('news-list').innerHTML = `
            <div style="text-align:center; padding:60px 20px; color:var(--text-muted);">
                <p style="font-size:18px; font-weight:600;">${msg}</p>
            </div>`;
    }

    function refreshNews() { fetchNews(); }

    window.onload = () => {
        initTheme();
        fetchNews();
    };
</script>

</body>
</html>
